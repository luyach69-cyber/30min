name: Daily TW Stock Radar

on:
  schedule:
    # GitHub 使用 UTC 時間，台灣時間 17:30 = UTC 時間 09:30 (週一至週五)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 允許在網頁上手動點擊按鈕測試執行

permissions:
  contents: write # 允許自動將更新後的 SQLite 資料庫存回倉庫

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock radar script
        env:
          # 從 GitHub Secrets 讀取敏感資訊，避免 Token 外洩
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python tw_stock_radar.py

      - name: Commit and push updated SQLite DB
        run: |
          git config --global user.name "StockRadarBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add tw_stock_history.db
          git commit -m "Update daily stock data" || exit 0
          git push
